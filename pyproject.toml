[project]
name = "autodata"
version = "0.1.0"
description = "Reproduction of Agentic Self-Instruct (Autodata, arXiv 2606.25996) - CS research-paper pipeline"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.60",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6",
  "orjson>=3.9",
  "tqdm>=4.66",
  "rich>=13",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
autodata-build-corpus = "autodata.data.build_corpus:main"
autodata-run-cs = "autodata.cs.pipeline:main"
autodata-cot-baseline = "autodata.cs.cot_baseline:main"
autodata-stats = "autodata.cs.stats:main"
autodata-evaluate-rubric = "autodata.cs.evaluate_rubric:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
